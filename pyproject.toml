[project]
name = "talktopia"
version = "0.1.0"
description = "A SOTOPIA-based social interaction pipeline"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
talktopia = "talktopia.pipeline:main"
talktopia-load-profiles = "talktopia.load_geminilight_profiles:main"
talktopia-models = "talktopia.models.servers:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["talktopia*"]

[tool.setuptools.package-data]
"talktopia.full_duplex" = ["prompts/*.txt"]
"talktopia.evaluation" = ["prompts/*.txt"]
